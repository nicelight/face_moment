name: face-moment

x-application: &application
  build:
    context: .
  image: "${FACE_MOMENT_IMAGE:-face-moment:dev}"
  restart: unless-stopped
  environment: &application-environment
    DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-face_moment}:${POSTGRES_PASSWORD:-face_moment_dev}@postgres:5432/${POSTGRES_DB:-face_moment}"
    S3_ENDPOINT_URL: "http://minio:9000"
    S3_ACCESS_KEY: "${MINIO_ROOT_USER:-face_moment}"
    S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-face_moment_dev}"
    S3_BUCKET: "${S3_BUCKET:-face-moment-private}"
    POSTGRESQL_CAPACITY_VIEW_PATH: "/run/face-moment/postgresql"
    POSTGRESQL_CAPACITY_LOW_THRESHOLD_BYTES: "${POSTGRESQL_CAPACITY_LOW_THRESHOLD_BYTES:-1073741824}"
    MINIO_CAPACITY_VIEW_PATH: "/run/face-moment/minio"
    MINIO_CAPACITY_LOW_THRESHOLD_BYTES: "${MINIO_CAPACITY_LOW_THRESHOLD_BYTES:-1073741824}"
    DEPENDENCY_WAIT_SECONDS: "${DEPENDENCY_WAIT_SECONDS:-60}"
    BACKGROUND_WORKER_IDLE_SECONDS: "${BACKGROUND_WORKER_IDLE_SECONDS:-0.2}"
    REALTIME_DEADLINE_MS: "${REALTIME_DEADLINE_MS:-3000}"
    REALTIME_RATE_LIMIT: "${REALTIME_RATE_LIMIT:-60}"
    REALTIME_RATE_WINDOW_SECONDS: "${REALTIME_RATE_WINDOW_SECONDS:-60}"
    REALTIME_RESULT_DISPLAY_MS: "${REALTIME_RESULT_DISPLAY_MS:-15000}"
    PROMO_QR_TICKET_SECRET: "${PROMO_QR_TICKET_SECRET:-face-moment-development-only-qr-ticket}"
    PHOTO_PREVIEW_MAXIMUM_EDGE: "${PHOTO_PREVIEW_MAXIMUM_EDGE:-1024}"
    PHOTO_PREVIEW_JPEG_QUALITY: "${PHOTO_PREVIEW_JPEG_QUALITY:-82}"
    PHOTO_THUMBNAIL_MAXIMUM_EDGE: "${PHOTO_THUMBNAIL_MAXIMUM_EDGE:-320}"
    PHOTO_THUMBNAIL_JPEG_QUALITY: "${PHOTO_THUMBNAIL_JPEG_QUALITY:-75}"
    SFACE_DETECTOR_PATH: "${SFACE_DETECTOR_PATH:-/run/face-moment/models/opencv_sface/yunet.onnx}"
    SFACE_DETECTOR_ID: "${SFACE_DETECTOR_ID:-}"
    SFACE_DETECTOR_VERSION: "${SFACE_DETECTOR_VERSION:-}"
    SFACE_RECOGNIZER_PATH: "${SFACE_RECOGNIZER_PATH:-/run/face-moment/models/opencv_sface/sface.onnx}"
    SFACE_RECOGNIZER_ID: "${SFACE_RECOGNIZER_ID:-}"
    SFACE_RECOGNIZER_VERSION: "${SFACE_RECOGNIZER_VERSION:-}"
    SFACE_PREPROCESSING_VERSION: "${SFACE_PREPROCESSING_VERSION:-}"
    SFACE_ALIGNMENT_VERSION: "${SFACE_ALIGNMENT_VERSION:-}"
    SFACE_NORMALIZATION_VERSION: "${SFACE_NORMALIZATION_VERSION:-}"
    SFACE_EMBEDDING_DIMENSION: "${SFACE_EMBEDDING_DIMENSION:-}"
    BUFFALO_DETECTOR_PATH: "${BUFFALO_DETECTOR_PATH:-/run/face-moment/models/insightface_buffalo_m/scrfd.onnx}"
    BUFFALO_DETECTOR_ID: "${BUFFALO_DETECTOR_ID:-}"
    BUFFALO_DETECTOR_VERSION: "${BUFFALO_DETECTOR_VERSION:-}"
    BUFFALO_RECOGNIZER_PATH: "${BUFFALO_RECOGNIZER_PATH:-/run/face-moment/models/insightface_buffalo_m/w600k_r50.onnx}"
    BUFFALO_RECOGNIZER_ID: "${BUFFALO_RECOGNIZER_ID:-}"
    BUFFALO_RECOGNIZER_VERSION: "${BUFFALO_RECOGNIZER_VERSION:-}"
    BUFFALO_PREPROCESSING_VERSION: "${BUFFALO_PREPROCESSING_VERSION:-}"
    BUFFALO_ALIGNMENT_VERSION: "${BUFFALO_ALIGNMENT_VERSION:-}"
    BUFFALO_NORMALIZATION_VERSION: "${BUFFALO_NORMALIZATION_VERSION:-}"
    BUFFALO_EMBEDDING_DIMENSION: "${BUFFALO_EMBEDDING_DIMENSION:-}"
    NO_ALBUMENTATIONS_UPDATE: "1"
  networks:
    - private

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-face_moment}"
      POSTGRES_USER: "${POSTGRES_USER:-face_moment}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-face_moment_dev}"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-face_moment} -d ${POSTGRES_DB:-face_moment}"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-face_moment}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-face_moment_dev}"
    volumes:
      - minio-data:/data
    networks:
      - private

  migrate:
    <<: *application
    restart: "no"
    command: ["face-moment-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  backend:
    <<: *application
    command: ["face-moment-backend"]
    expose:
      - "8000"
    volumes:
      - postgres-data:/run/face-moment/postgresql:ro
      - minio-data:/run/face-moment/minio:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  background-worker:
    <<: *application
    command: ["face-moment-background-worker"]
    expose:
      - "8001"
    volumes:
      - "${FACE_MOMENT_MODEL_DIR:-./models}:/run/face-moment/models:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  realtime:
    <<: *application
    command: ["face-moment-realtime"]
    expose:
      - "8002"
    volumes:
      - "${FACE_MOMENT_MODEL_DIR:-./models}:/run/face-moment/models:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  edge:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FACE_MOMENT_EDGE_PORT:-8443}:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - private
      - edge
    depends_on:
      backend:
        condition: service_healthy
      realtime:
        condition: service_healthy

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
