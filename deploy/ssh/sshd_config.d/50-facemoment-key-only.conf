# Face Moment pilot SSH policy.
#
# Deploy this drop-in through the host's normal configuration management. The
# policy deliberately does not edit authorized_keys or rotate any credential.
# Keep the administrative facemoment key available before enabling it.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
DenyUsers display
