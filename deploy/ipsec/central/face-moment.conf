connections {
    face-moment-backhaul {
        version = 2
        local_addrs = %any
        remote_addrs = 46.8.200.99
        remote_port = 55000
        proposals = aes256gcm16-prfsha384-ecp384
        encap = yes
        fragmentation = yes
        mobike = yes
        dpd_delay = 15s
        send_cert = always
        keyingtries = 0
        unique = replace

        local {
            auth = pubkey
            certs = central-cert.pem
            id = central.face-moment.internal
        }

        remote {
            auth = pubkey
            id = vps.face-moment.internal
        }

        children {
            backhaul {
                local_ts = 10.77.0.2/32
                remote_ts = 10.77.0.1/32
                if_id_in = 42
                if_id_out = 42
                esp_proposals = aes256gcm16-ecp384
                start_action = start
                dpd_action = restart
                close_action = restart
            }
        }
    }
}
